# Promtail needs a read-only docker.sock to discover containers and tail their
# logs. This is the local dev stack; nothing mounts the socket on the cluster.
# Disabled per-file, so the rules still apply to every other manifest.
# kics-scan disable=d6355c88-1e8d-49e9-b2f2-f8a1ca12c75b,1c1325ff-831d-43a1-973e-839ae57dfcc0
name: team-99-downtime

x-java-dev: &java-dev
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
  networks: [team99]
  environment:
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devuser}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devpass}

services:
  # Single-origin dev gateway : browser hits http://localhost:9099,
  # Caddy routes by path to each service. Config in ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '9099:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - client
      - auth-service
      - swagger-ui
    networks: [team99]
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS_PRIMARY_NAME: budget-service
      URLS: >-
        [
          {"url":"/api/budgets/v3/api-docs","name":"budget-service"},
          {"url":"/api/transactions/v3/api-docs","name":"transaction-service"},
          {"url":"/api/notifications/v3/api-docs","name":"notification-service"},
          {"url":"/api/genai/openapi.json","name":"genai-service"}
        ]
    networks: [team99]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on a fresh volume, re-run with `docker compose down -v` to re-bootstrap.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [team99]

  # Creates missing per-service databases, then exits (init scripts alone only
  # run on a fresh volume).
  db-init:
    image: postgres:16-alpine
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-devuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpass}
      PGDATABASE: ${POSTGRES_DB:-postgres}
    volumes:
      - ./infra/postgres/init/01-create-databases.sql:/create-databases.sql:ro
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/create-databases.sql']
    networks: [team99]

  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    environment:
      STORE_PATH: /app
    ports:
      - '4983:4983'
    volumes:
      - ./infra/drizzle-studio:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks: [team99]

  # Run-once migration job: applies the Better Auth schema to auth_db, then
  # exits. auth-service waits for this to finish (service_completed_successfully)
  # so no manual migrate step is needed. Mirrors a Kubernetes Job / initContainer
  # for the production deployment (#64) — migration is separate from serving and
  # runs once regardless of how many auth-service replicas exist.
  auth-migrate:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/auth_db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demodemo1234!}
    # Runs the programmatic migration (better-auth/db/migration) via the service's
    # own config + pg adapter — no CLI, no native deps to compile in the image.
    command: sh -c "bun install --frozen-lockfile --ignore-scripts && cd apps/auth-service && exec bun run src/migrate.ts"
    volumes:
      - .:/workspace
      - auth_service_node_modules:/workspace/node_modules
    networks: [team99]

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/auth_db
      # Browser-facing origin: the single Caddy gateway (http://localhost:9099). OAuth
      # redirects, cookies and the token issuer all use this. The Spring/Python
      # services fetch JWKS server-to-server at http://auth-service:3000.
      BETTER_AUTH_URL: http://localhost:9099
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PORT: '3000'
    # Run the server directly to avoid NX processing the project graph (which
    # invokes @nx/gradle and requires Java — not present in the bun:alpine image).
    command: sh -c "bun install --frozen-lockfile --ignore-scripts && cd apps/auth-service && exec bun --watch run src/server.ts"
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - auth_service_node_modules:/workspace/node_modules
    networks: [team99]

  transaction-service:
    <<: *java-dev
    build:
      context: .
      dockerfile: apps/transaction-service/Dockerfile
      target: dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      # Per-service Gradle home: a shared volume causes lock contention on
      # /root/.gradle/caches/journal-1.lock.
      - gradle_cache_transaction:/root/.gradle
      # Per-service project cache: masks /workspace/.gradle from the host bind
      # mount so all 3 services don't fight over fileHashes.lock.
      # (--project-cache-dir would work too, but it's incompatible with --continuous.)
      - gradle_project_transaction:/workspace/.gradle

  notification-service:
    <<: *java-dev
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
      target: dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - '8081:8081'
    volumes:
      - .:/workspace
      - gradle_cache_notification:/root/.gradle
      - gradle_project_notification:/workspace/.gradle

  budget-service:
    <<: *java-dev
    build:
      context: .
      dockerfile: apps/budget-service/Dockerfile
      target: dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/budget_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - '8082:8082'
    volumes:
      - .:/workspace
      - gradle_cache_budget:/root/.gradle
      - gradle_project_budget:/workspace/.gradle

  genai-service:
    build:
      context: .
      dockerfile: apps/genai-service/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # Logos LLM gateway; the key lives in the gitignored .env only.
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://logos.aet.cit.tum.de:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      # Weekly summaries are persisted in the service's own database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/genai_db
    ports:
      - '8000:8000'
    volumes:
      - ./apps/genai-service/src:/workspace/apps/genai-service/src
    networks: [team99]

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: dev
    restart: unless-stopped
    # No auth env here: the browser reaches everything through the Caddy gateway
    # (http://localhost:9099), which routes /api/auth to auth-service. The client is
    # same-origin behind Caddy and never calls auth-service directly.
    ports:
      - '4200:4200'
    volumes:
      - .:/workspace
      - client_node_modules:/workspace/node_modules
    networks: [team99]

  # Observability: metrics (Prometheus) + logs (Loki) in Grafana, alerts mailed
  # by Alertmanager. Config in ./infra — see docs/deployment/OBSERVABILITY.md.
  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - alertmanager
    networks: [team99]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - '9093:9093'
    depends_on:
      - mailhog
    networks: [team99]

  # Capture-only SMTP: holds the alert mails instead of delivering them, so the
  # stack needs no real SMTP credentials.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '8025:8025'
    networks: [team99]

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'
    networks: [team99]

  promtail:
    image: grafana/promtail:3.5.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Container discovery + log streaming both go through the daemon socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks: [team99]

  grafana:
    image: grafana/grafana:12.4.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default on purpose: `:?` refuses to start rather than fall back to a
      # guessable admin/admin.
      # kics-scan ignore-line
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env - see .env.example}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # The chart's dashboards are Prometheus-only so they also render in the
      # cluster, where no Loki is deployed. The log panels live alongside them
      # here, where Loki and Promtail are part of the stack.
      - ./k8s/helm/t99-app/files/dashboards:/var/lib/grafana/dashboards/shared:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards/local:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - loki
    networks: [team99]

volumes:
  postgres_data:
  gradle_cache_transaction:
  gradle_cache_notification:
  gradle_cache_budget:
  gradle_project_transaction:
  gradle_project_notification:
  gradle_project_budget:
  client_node_modules:
  auth_service_node_modules:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:

networks:
  team99:
