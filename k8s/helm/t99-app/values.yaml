global:
  imageRegistry: ghcr.io/aet-devops26/team-99-downtime

domain: ''
clusterIssuer: letsencrypt-prod

postgresql:
  image:
    tag: '16-alpine'
  persistence:
    storageClass: ''
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

authService:
  image:
    repository: t99-auth-service
    tag: ''
  port: 3000
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

client:
  image:
    repository: t99-client
    tag: ''
  port: 8080
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m

transactionService:
  image:
    repository: t99-transaction-service
    tag: ''
  port: 8080
  javaOpts: '-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport'
  resources:
    requests:
      memory: 192Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 300m

notificationService:
  image:
    repository: t99-notification-service
    tag: ''
  port: 8081
  javaOpts: '-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport'
  resources:
    requests:
      memory: 192Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 300m

budgetService:
  image:
    repository: t99-budget-service
    tag: ''
  port: 8082
  javaOpts: '-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport'
  resources:
    requests:
      memory: 192Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 300m

genaiService:
  image:
    repository: t99-genai-service
    tag: ''
  port: 8000
  # Logos key; set via --set from CI secrets. Empty keeps the cluster's value.
  llmApiKey: ''
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 150m

swaggerUi:
  image:
    repository: swaggerapi/swagger-ui
    tag: v5.32.14
  port: 8080
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m

drizzleStudio:
  enabled: false
  # Which PostgreSQL database to use as the first pre-configured connection
  database: auth_db
  storageClass: ''
  oauth:
    # Set to false to expose studio directly without the oauth2-proxy (no auth)
    enabled: true
  github:
    # Repo whose collaborators are allowed in (org/repo)
    repo: 'aet-devops26/team-99-downtime'
    # Set via --set or CI secrets; never commit real values here
    clientId: ''
    clientSecret: ''
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 100m

# Observability. Prometheus scrapes the pods that carry the prometheus.io
# annotations; Grafana and Alertmanager sit behind the same GitHub OAuth as
# Drizzle Studio (see drizzleStudio.github).
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.14.0
    retention: 7d
    storage: 5Gi
    storageClass: ''
    resources:
      requests:
        memory: 192Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 100m
  grafana:
    image: grafana/grafana:12.4.5
    storage: 1Gi
    storageClass: ''
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 50m
  alertmanager:
    image: prom/alertmanager:v0.34.0
    storage: 1Gi
    storageClass: ''
    resources:
      requests:
        memory: 48Mi
        cpu: 20m
      limits:
        memory: 64Mi
        cpu: 30m

# Email notifications for firing alerts, delivered through Resend's SMTP relay.
# Without resendApiKey the stack still deploys — Alertmanager just has no
# receiver, so alerts stay visible in its UI and in Prometheus.
alertmanager:
  from: 'noreply@1ho.st'
  to: 'noreply@1ho.st'
  # Set via --set / the deploy script / CI secrets; never commit a real key.
  resendApiKey: ''
