{{- /*
Create any missing per-service databases once per deploy — the k8s twin of the
compose db-init service. Postgres initdb scripts (postgresql/configmap.yaml)
only run on a FRESH volume, so a database added later (e.g. genai_db) would
never appear on existing stage/prod volumes without this.

Why a pre-upgrade hook Job and not an initContainer: a hook runs exactly once
per helm deploy, before the new pods roll out, regardless of replica counts —
an initContainer would run per pod and race itself once a service scales.
pre-upgrade only (no pre-install): on a first install postgres does not exist
yet, and a fresh volume gets every database from the initdb scripts anyway.

The SQL is mounted from a hook-scoped ConfigMap rather than the regular
postgresql-init one: pre-upgrade hooks run before the release's manifests are
applied, so the regular ConfigMap would still hold the PREVIOUS deploy's SQL —
missing exactly the database this deploy introduces.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-db-init-sql
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  create-databases.sql: |
{{ .Files.Get "files/init-databases.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    # Jobs are immutable: replace last deploy's job, keep a failed one around
    # for debugging, clean up on success.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "t99-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: "postgres:{{ .Values.postgresql.image.tag }}"
          # The namespace ResourceQuota tracks limits.cpu/limits.memory, so a
          # pod without explicit limits is rejected at admission — the job then
          # never starts a pod and dies via activeDeadlineSeconds (#138). Keep
          # these well under the quota headroom: the pod is additive while the
          # previous release is still running.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command:
            - sh
            - -ec
            - |
              until pg_isready; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -f /sql/create-databases.sql
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-postgresql
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: t99-db-credentials
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ .Release.Name }}-db-init-sql
