{{- if .Values.drizzleStudio.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-studio-ingress
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: t99-studio-auth
    nginx.ingress.kubernetes.io/auth-realm: "Drizzle Studio"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - studio.{{ .Values.domain }}
      secretName: {{ .Release.Name }}-studio-tls
  rules:
    - host: studio.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-studio
                port:
                  number: 4983
{{- end }}
