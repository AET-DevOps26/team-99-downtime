{{- if .Values.drizzleStudio.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-studio-ingress
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - studio.{{ .Values.domain }}
      secretName: {{ .Release.Name }}-studio-tls
  rules:
    - host: studio.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.drizzleStudio.oauth.enabled }}
                name: {{ .Release.Name }}-studio-oauth2
                port:
                  number: 4180
                {{- else }}
                name: {{ .Release.Name }}-studio
                port:
                  number: 4983
                {{- end }}
{{- end }}
