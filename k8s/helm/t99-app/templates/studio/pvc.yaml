{{- if .Values.drizzleStudio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-studio-store
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
  {{- if .Values.drizzleStudio.storageClass }}
  storageClassName: {{ .Values.drizzleStudio.storageClass }}
  {{- end }}
{{- end }}
