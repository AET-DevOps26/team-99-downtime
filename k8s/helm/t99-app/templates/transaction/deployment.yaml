apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-transaction
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "t99-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: transaction
  template:
    metadata:
      labels:
        {{- include "t99-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: transaction
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: transaction
          image: {{ include "t99-app.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.transactionService.image.repository "tag" .Values.transactionService.image.tag) }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: t99-db-credentials
                  key: password
            - name: SPRING_DATASOURCE_PASSWORD
              value: "$(DB_PASSWORD)"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-transaction-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.transactionService.resources | nindent 12 }}
