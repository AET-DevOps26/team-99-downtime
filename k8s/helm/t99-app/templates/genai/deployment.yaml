apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-genai
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "t99-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: genai
  template:
    metadata:
      labels:
        {{- include "t99-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: genai
        monitoring: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: genai
          image: {{ include "t99-app.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.genaiService.image.repository "tag" .Values.genaiService.image.tag) }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: t99-app-secrets
                  key: llmApiKey
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: t99-db-credentials
                  key: password
            # Weekly summaries are persisted in the service's own database.
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/genai_db"
            - name: APP_VERSION
              value: {{ .Values.genaiService.image.tag | default .Chart.AppVersion | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-genai-config
          # Gates liveness/readiness until the app is up; allows up to 2 min
          # for a cold start (image pull + uvicorn + summary-store connect).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            {{- toYaml .Values.genaiService.resources | nindent 12 }}
