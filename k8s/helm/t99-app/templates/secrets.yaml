{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace "t99-db-credentials" -}}
apiVersion: v1
kind: Secret
metadata:
  name: t99-db-credentials
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $dbSecret $dbSecret.data }}
  password: {{ index $dbSecret.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
{{- $appSecret := lookup "v1" "Secret" .Release.Namespace "t99-app-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: t99-app-secrets
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $appSecret $appSecret.data }}
  jwtSigningKey: {{ index $appSecret.data "jwtSigningKey" }}
  {{- else }}
  jwtSigningKey: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- if .Values.demoUserPassword }}
  demoUserPassword: {{ .Values.demoUserPassword | b64enc }}
  {{- else if and $appSecret $appSecret.data (index $appSecret.data "demoUserPassword") }}
  demoUserPassword: {{ index $appSecret.data "demoUserPassword" }}
  {{- else }}
  demoUserPassword: {{ "" | b64enc }}
  {{- end }}
  {{- if .Values.genaiService.llmApiKey }}
  llmApiKey: {{ .Values.genaiService.llmApiKey | b64enc }}
  {{- else if and $appSecret $appSecret.data (index $appSecret.data "llmApiKey") }}
  llmApiKey: {{ index $appSecret.data "llmApiKey" }}
  {{- else }}
  llmApiKey: {{ "" | b64enc }}
  {{- end }}
{{- if .Values.drizzleStudio.enabled }}
---
{{- $oauthSecret := lookup "v1" "Secret" .Release.Namespace "t99-studio-oauth2" -}}
{{- $cookieSecret := "" -}}
{{- if and $oauthSecret $oauthSecret.data -}}
  {{- $cookieSecret = index $oauthSecret.data "cookieSecret" | b64dec -}}
{{- else -}}
  {{- $cookieSecret = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: t99-studio-oauth2
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  clientId: {{ .Values.drizzleStudio.github.clientId | b64enc }}
  clientSecret: {{ .Values.drizzleStudio.github.clientSecret | b64enc }}
  cookieSecret: {{ $cookieSecret | b64enc }}
{{- end }}
