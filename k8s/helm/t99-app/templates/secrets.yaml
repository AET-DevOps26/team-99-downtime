{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace "t99-db-credentials" -}}
apiVersion: v1
kind: Secret
metadata:
  name: t99-db-credentials
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $dbSecret $dbSecret.data }}
  password: {{ index $dbSecret.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
{{- $appSecret := lookup "v1" "Secret" .Release.Namespace "t99-app-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: t99-app-secrets
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $appSecret $appSecret.data }}
  jwtSigningKey: {{ index $appSecret.data "jwtSigningKey" }}
  {{- else }}
  jwtSigningKey: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- if .Values.drizzleStudio.enabled }}
---
{{- $studioSecret := lookup "v1" "Secret" .Release.Namespace "t99-studio-auth" -}}
{{- $studioPassword := "" -}}
{{- if and $studioSecret $studioSecret.data -}}
  {{- $studioPassword = index $studioSecret.data "password" | b64dec -}}
{{- else -}}
  {{- $studioPassword = randAlphaNum 24 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: t99-studio-auth
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # plain-text password for retrieval via: kubectl get secret t99-studio-auth -o jsonpath='{.data.password}' | base64 -d
  password: {{ $studioPassword | b64enc }}
  # htpasswd-format entry consumed by nginx basic auth
  auth: {{ htpasswd .Values.drizzleStudio.username $studioPassword | b64enc }}
{{- end }}
