apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-budget-config
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/budget_db
  SPRING_DATASOURCE_USERNAME: postgres
  AUTH_JWKS_URI: http://{{ .Release.Name }}-auth:3000/api/auth/jwks
  AUTH_ISSUER: https://{{ .Values.domain }}
  JAVA_TOOL_OPTIONS: {{ .Values.budgetService.javaOpts | quote }}
  TRANSACTION_SERVICE_URL: http://{{ .Release.Name }}-transaction:8080
  NOTIFICATION_SERVICE_URL: http://{{ .Release.Name }}-notification:8081
