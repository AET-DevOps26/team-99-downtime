apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-budget
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    {{- include "t99-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: budget
