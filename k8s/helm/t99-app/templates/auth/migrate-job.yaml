apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-auth-migrate-{{ .Release.Revision }}
  labels:
    {{- include "t99-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "t99-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "t99-app.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.authService.image.repository "tag" .Values.authService.image.tag) }}
          command: ["bun", "run", "src/migrate.ts"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: t99-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/auth_db"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: t99-app-secrets
                  key: jwtSigningKey
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: t99-app-secrets
                  key: demoUserPassword
                  optional: true
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-auth-config
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
