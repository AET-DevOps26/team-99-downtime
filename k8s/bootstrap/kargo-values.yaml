# Kargo Helm Chart values override for minimal resource usage
# Namespace constraint: 0.5 GB RAM / 0.5 CPU total
# Target usage: ~320Mi / 250m

# Disable webhooksServer (not needed for this setup)
webhooksServer:
  enabled: false

# Kargo API Server - API server + UI
api:
  replicas: 1
  resources:
    requests:
      memory: '64Mi'
      cpu: '50m'
    limits:
      memory: '128Mi'
      cpu: '100m'

  # Admin account configuration
  # Set via --set flags or patched after install
  adminAccount:
    enabled: true
    passwordHash: ''
    tokenSigningKey: ''

# Kargo Controller - Promotion controller
controller:
  replicas: 1
  resources:
    requests:
      memory: '64Mi'
      cpu: '50m'
    limits:
      memory: '128Mi'
      cpu: '100m'

# Garbage Collector - Cleans up old Freight
garbageCollector:
  replicas: 1
  resources:
    requests:
      memory: '32Mi'
      cpu: '20m'
    limits:
      memory: '64Mi'
      cpu: '50m'
