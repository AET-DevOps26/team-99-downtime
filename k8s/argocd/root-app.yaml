apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t99-root
  namespace: t99-argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aet-devops26/team-99-downtime
    targetRevision: main
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: t99-argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
