apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: t99-stage
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: t99-observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.stage.t99.stud.k8s.aet.cit.tum.de
      secretName: grafana-tls
  rules:
    # Public, so Grafana's own login is the only gate: sign-up is disabled and
    # the admin password is random (generated by apply.sh).
    - host: grafana.stage.t99.stud.k8s.aet.cit.tum.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
