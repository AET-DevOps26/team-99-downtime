apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-oauth2
  labels:
    app.kubernetes.io/name: grafana-oauth2
    app.kubernetes.io/part-of: t99-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-oauth2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-oauth2
        app.kubernetes.io/part-of: t99-observability
    spec:
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --provider=github
            # Gated on repo collaborators. Grafana's own GitHub login can only
            # gate on org membership, which is why the proxy sits in front.
            - --github-repo=aet-devops26/team-99-downtime
            # One proxy, three upstreams: Alertmanager and MailHog are served
            # under path prefixes, so a single login covers all of them.
            - --upstream=http://grafana:3000
            - --upstream=http://alertmanager:9093/alerts/
            - --upstream=http://mailhog:8025/mail/
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://grafana.t99.stud.k8s.aet.cit.tum.de/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_t99_grafana_oauth2
            - --reverse-proxy=true
            - --banner=ExpenseFlow Observability — team-99-downtime collaborators only
            - '--scope=user:email read:org'
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-github
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-github
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-github
                  key: cookie-secret
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-oauth2
  labels:
    app.kubernetes.io/name: grafana-oauth2
    app.kubernetes.io/part-of: t99-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-oauth2
  ports:
    - name: http
      port: 4180
      targetPort: 4180
