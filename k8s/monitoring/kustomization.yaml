apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/rules.yaml
  - prometheus/pvc.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - mailhog/deployment.yaml
  - mailhog/service.yaml
  - alertmanager/pvc.yaml
  - alertmanager/deployment.yaml
  - alertmanager/service.yaml
  - grafana/datasource.yaml
  - grafana/dashboard-provider.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
# Generated by apply.sh, so not listed here: the grafana-dashboards and
# alertmanager-config ConfigMaps (from the committed files under infra/) and the
# grafana-admin Secret (random password).
