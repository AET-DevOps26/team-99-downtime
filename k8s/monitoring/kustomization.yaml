apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The app's namespace, not a dedicated one: we hold no cluster-scoped rights.
namespace: t99-prod

resources:
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/rules.yaml
  - prometheus/pvc.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - alerting/alertmanager.yaml
  - alerting/mailhog.yaml
  - grafana/datasource.yaml
  - grafana/dashboard-provider.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - grafana/oauth2-proxy.yaml
  - grafana/ingress.yaml
# Generated by apply.sh: the grafana-dashboards and alertmanager-config
# ConfigMaps (from the committed files under infra/) and the grafana-admin /
# grafana-github Secrets.
