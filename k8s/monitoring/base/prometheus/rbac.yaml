apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: t99-observability
---
# Namespaced Role: we hold no cluster-scoped RBAC on the shared AET cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: t99-observability
rules:
  - apiGroups: ['']
    resources:
      - services
      - endpoints
      - pods
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: t99-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  # No namespace: kustomize fills in the overlay's. Hardcoding it here would
  # bind prod's RoleBinding to the stage ServiceAccount.
  - kind: ServiceAccount
    name: prometheus
