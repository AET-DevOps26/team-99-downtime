apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: t99-observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.t99.stud.k8s.aet.cit.tum.de
      secretName: grafana-tls
  rules:
    # One host, one proxy. oauth2-proxy fans out by path: / to Grafana,
    # /alerts to Alertmanager, /mail to MailHog. None of them is reachable
    # from outside on its own.
    - host: grafana.t99.stud.k8s.aet.cit.tum.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-oauth2
                port:
                  number: 4180
