apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: t99-prod

# The prod quota has room for the full stack, so alerting runs here too.
resources:
  - ../../base
  - prometheus-config.yaml
  - alerting/alertmanager.yaml
  - alerting/mailhog.yaml
  - ingress.yaml

patches:
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: https://grafana.t99.stud.k8s.aet.cit.tum.de
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 192Mi
  # oauth2-proxy also fronts Alertmanager (/alerts) and MailHog (/mail); both
  # are configured with a matching path prefix so their own links keep working.
  - target:
      kind: Deployment
      name: grafana-oauth2
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --provider=github
          - --github-repo=aet-devops26/team-99-downtime
          - --upstream=http://grafana:3000
          - --upstream=http://alertmanager:9093/alerts/
          - --upstream=http://mailhog:8025/mail/
          - --http-address=0.0.0.0:4180
          - --redirect-url=https://grafana.t99.stud.k8s.aet.cit.tum.de/oauth2/callback
          - --email-domain=*
          - --cookie-secure=true
          - --cookie-name=_t99_grafana_oauth2
          - --reverse-proxy=true
          - --banner=ExpenseFlow Observability — team-99-downtime collaborators only
          - '--scope=user:email read:org'
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 150m
