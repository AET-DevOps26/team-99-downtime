apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/part-of: t99-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailhog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailhog
        app.kubernetes.io/part-of: t99-observability
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          env:
            # Served under /mail by the shared oauth2-proxy.
            - name: MH_UI_WEB_PATH
              value: mail
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /mail/
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 24Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 20m
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/part-of: t99-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
