apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: t99-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Silences and notification state only — it stores no metrics.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: t99-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: t99-observability
    spec:
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # Served under /alerts by the shared oauth2-proxy, so it must know
            # its own prefix or every link and redirect breaks.
            - --web.external-url=https://grafana.t99.stud.k8s.aet.cit.tum.de/alerts
            - --web.route-prefix=/alerts
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /alerts/-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 48Mi
              cpu: 20m
            limits:
              memory: 64Mi
              cpu: 40m
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: t99-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
