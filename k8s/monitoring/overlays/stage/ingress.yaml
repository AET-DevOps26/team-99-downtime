apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: t99-observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.stage.t99.stud.k8s.aet.cit.tum.de
      secretName: grafana-tls
  rules:
    # Everything goes through oauth2-proxy, which forwards to Grafana once the
    # GitHub check passes. Grafana itself is never reachable from outside.
    - host: grafana.stage.t99.stud.k8s.aet.cit.tum.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-oauth2
                port:
                  number: 4180
