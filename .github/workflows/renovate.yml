name: Renovate

on:
  schedule:
    - cron: '0 5 * * 1' # every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.1.17
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
