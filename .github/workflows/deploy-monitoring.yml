name: Deploy Monitoring

# Keeps the observability stack in sync with the manifests, so it never drifts
# from what is committed.
on:
  push:
    branches: [main]
    paths:
      - 'k8s/monitoring/**'
      - 'infra/grafana/**'
      - 'infra/monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy monitoring
    runs-on: ubuntu-latest
    # Lets the deploy be gated with required reviewers in the repo settings.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      # The ConfigMaps, the Grafana admin password and the oauth2-proxy secret
      # are all handled by apply.sh, so CI runs the same script a developer does.
      - name: Deploy
        env:
          GRAFANA_OAUTH_CLIENT_ID: ${{ secrets.GRAFANA_OAUTH_CLIENT_ID }}
          GRAFANA_OAUTH_CLIENT_SECRET: ${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}
        run: ./k8s/monitoring/apply.sh

      - name: Wait for rollout
        run: |
          for d in prometheus grafana grafana-oauth2 alertmanager mailhog; do
            kubectl -n t99-prod rollout status "deploy/$d" --timeout=3m
          done
