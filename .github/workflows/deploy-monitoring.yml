name: Deploy Monitoring

# Keeps the observability stack in sync with the manifests, so it never drifts
# from what is committed. Stage deploys on every push to main that touches the
# monitoring config; prod is promoted manually.
on:
  push:
    branches: [main]
    paths:
      - 'k8s/monitoring/**'
      - 'infra/grafana/**'
      - 'infra/monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        default: 'stage'
        type: choice
        options: [stage, prod]

jobs:
  deploy:
    name: Deploy monitoring (${{ inputs.environment || 'stage' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      # The dashboards and Alertmanager ConfigMaps, the Grafana admin password
      # and the oauth2-proxy secret are all handled by apply.sh, so CI runs the
      # same script a developer would.
      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment || 'stage' }}
          GRAFANA_OAUTH_CLIENT_ID: ${{ inputs.environment == 'prod' && secrets.GRAFANA_OAUTH_CLIENT_ID_PROD || secrets.GRAFANA_OAUTH_CLIENT_ID_STAGE }}
          GRAFANA_OAUTH_CLIENT_SECRET: ${{ inputs.environment == 'prod' && secrets.GRAFANA_OAUTH_CLIENT_SECRET_PROD || secrets.GRAFANA_OAUTH_CLIENT_SECRET_STAGE }}
        run: ./k8s/monitoring/apply.sh "$ENVIRONMENT"

      - name: Wait for rollout
        env:
          NAMESPACE: ${{ inputs.environment == 'prod' && 't99-prod' || 't99-stage' }}
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/prometheus --timeout=3m
          kubectl -n "$NAMESPACE" rollout status deploy/grafana --timeout=3m
          kubectl -n "$NAMESPACE" rollout status deploy/grafana-oauth2 --timeout=3m
