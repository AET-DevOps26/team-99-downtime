name: Security (PR)

on:
  pull_request:

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal shared permissions; jobs override as needed.
permissions:
  contents: read

jobs:
  # ── Tier 1 — fast, blocking ───────────────────────────────────────────────
  # These are linters and static checkers that run in seconds.
  # They block merge from day one.

  workflows:
    name: Workflow Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # pinned to v8.3.2

      - name: Run Zizmor
        run: |
          uvx zizmor@1.26.1 --format sarif .github/workflows/ > zizmor.sarif || true
          [ -s zizmor.sarif ] || echo '{"version":"2.1.0","runs":[]}' > zizmor.sarif

      - name: Annotate Zizmor findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: zizmor.sarif
          name: zizmor
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Detects which file categories changed so heavy jobs can be skipped when
  # their inputs are untouched.
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false
      - name: Detect changed file categories
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # pinned to v4.0.2
        with:
          filters: |
            dockerfiles:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '**/*.dockerfile'
            iac:
              - 'infra/**'
              - 'k8s/**'
              - '**/*.tf'
              - '**/*.tfvars'

  containers:
    name: Dockerfile Lint
    needs: [changes]
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      # failure-threshold: none so hadolint always writes the SARIF file
      # regardless of findings — reviewdog handles the blocking decision.
      - name: Lint Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # pinned to v3.3.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: none

      - name: Annotate Hadolint findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: hadolint.sarif
          name: hadolint
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: IaC Security
    needs: [changes]
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      # KICS found real issues during initial rollout — non-blocking until they
      # are triaged. Remove continue-on-error once the Security tab is clean.
      - name: Run KICS
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # pinned to v2.1.20
        continue-on-error: true
        with:
          path: '.'
          fail_on: high,critical
          output_formats: 'sarif'
          output_path: kics-results
          exclude_paths: 'node_modules,dist,.nx,tmp'

      - name: Ensure KICS SARIF exists
        if: always()
        run: |
          [ -s kics-results/results.sarif ] || \
            echo '{"version":"2.1.0","runs":[]}' > kics-results/results.sarif

      - name: Annotate KICS findings
        if: always()
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: kics-results/results.sarif
          name: kics
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Tier 2 — deeper scans, non-blocking during initial rollout ───────────
  # Findings appear as Check annotations via reviewdog.
  # continue-on-error: true lets the workflow finish regardless of findings.

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0 # full history required for gitleaks log-opts range
          persist-credentials: false

      # gitleaks-action v3 requires a commercial license for private repos.
      # Running the binary directly is free (MIT-licensed CLI, license applies
      # to the action wrapper only). Scans only the PR diff range.
      - name: Scan PR diff for secrets with GitLeaks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.26.0/gitleaks_8.26.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks || true
          gitleaks detect --source . \
            --log-opts="origin/${BASE_REF}..HEAD" \
            --report-format sarif --report-path gitleaks.sarif || true
          [ -s gitleaks.sarif ] || echo '{"version":"2.1.0","runs":[]}' > gitleaks.sarif

      - name: Annotate GitLeaks findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: gitleaks.sarif
          name: gitleaks
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem for secrets with Trivy
        uses: ./.github/actions/scan-trivy
        with:
          scan-type: fs
          target: .
          scanners: secret
          output: trivy-secrets.sarif

      - name: Annotate Trivy secret findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: trivy-secrets.sarif
          name: trivy-secrets
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Static Application Security Testing)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: pip install semgrep==1.169.0

      - name: Get changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD" | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # --config auto discovers rules for detected languages without requiring
      # a SEMGREP_APP_TOKEN. Managed p/ rulesets require login in semgrep v1.x
      # and return exit code 7 without authentication.
      # Only scans files changed in this PR via --include flags.
      - name: Run Semgrep
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          includes=$(echo "$CHANGED_FILES" | tr ' ' '\n' | grep -v '^$' | sed 's/^/--include /' | tr '\n' ' ')
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            $includes \
            . || true
          [ -s semgrep.sarif ] || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Annotate Semgrep findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: semgrep.sarif
          name: semgrep
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Scan dependencies with Trivy
        uses: ./.github/actions/scan-trivy
        with:
          scan-type: fs
          target: .
          scanners: vuln
          output: trivy-deps.sarif

      - name: Annotate Trivy dependency findings
        uses: ./.github/actions/reviewdog
        with:
          format: sarif
          input: trivy-deps.sarif
          name: trivy-deps
          fail-level: none
          github-token: ${{ secrets.GITHUB_TOKEN }}
