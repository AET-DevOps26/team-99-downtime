name: Deploy to Stage

on:
  release:
    types: [released]
  # zizmor: ignore[dangerous-triggers] — we only check out our own main branch and
  # never run code from the triggering workflow's head.
  workflow_run:
    workflows: ['Continuous Delivery']
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. 0.1.2 or latest)'
        default: 'latest'
        type: string

concurrency:
  group: deploy-stage
  cancel-in-progress: true

jobs:
  deploy-k8s:
    name: Deploy to k8s staging environment
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release view --json tagName -q .tagName)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to t99-stage
        uses: ./.github/actions/deploy-k8s
        with:
          version: ${{ steps.resolve-tag.outputs.tag }}
          namespace: t99-stage
          values-file: k8s/helm/t99-app/values.stage.yaml
          environment-url: https://stage.t99.stud.k8s.aet.cit.tum.de
          kubeconfig-data: ${{ secrets.KUBECONFIG_DATA }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          studio-github-client-id: ${{ secrets.STUDIO_GITHUB_CLIENT_ID }}
          studio-github-client-secret: ${{ secrets.STUDIO_GITHUB_CLIENT_SECRET }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
