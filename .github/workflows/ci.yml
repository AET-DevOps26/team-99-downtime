name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

jobs:
  # Runs on every PR event including title/body edits, which the other jobs
  # don't care about. The 'edited' type is on the shared trigger above so this
  # job fires then while the rest skip via github.event.action != 'edited'.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR title (can become squash merge commit message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint

      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Lint changed files
        run: bunx lint-staged --diff="origin/${{ github.base_ref }}...HEAD" --config config/lint-staged.config.mjs

      - name: Fail if linters left uncommitted changes
        run: git diff --exit-code

  helm-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check for Helm chart changes
        id: helm-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            helm:
              - 'k8s/helm/**'

      - name: Lint Helm chart
        if: steps.helm-changes.outputs.helm == 'true'
        run: helm lint k8s/helm/t99-app/ -f k8s/helm/t99-app/values.stage.yaml

  # Regenerates every OpenAPI spec and the typed client from the code (no
  # containers: springdoc Gradle plugin, FastAPI in-memory export, Better Auth
  # in-process extraction) and fails when the committed files don't match —
  # an API change must ship its spec + generated-client update in the same PR.
  openapi-drift:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    name: OpenAPI Drift Check
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Generate OpenAPI specs and typed client
        run: bun run openapi

      - name: Fail if committed specs or generated client are out of date
        run: |
          if [ -n "$(git status --porcelain -- openapi/ apps/client/src/shared/api/generated/)" ]; then
            git status --short -- openapi/ apps/client/src/shared/api/generated/
            git diff -- openapi/ apps/client/src/shared/api/generated/
            echo '::error::OpenAPI specs are out of date. Run `bun run openapi` and commit the result.'
            exit 1
          fi

  squawk:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find modified migrations
        id: modified-migrations
        run: |
          modified=$(git diff --diff-filter=d --name-only origin/$GITHUB_BASE_REF...origin/$GITHUB_HEAD_REF \
            | grep 'src/main/resources/db/migration/.*\.sql$' | tr '\n' ' ' || true)
          echo "$modified"
          echo "file_names=$modified" >> $GITHUB_OUTPUT

      - uses: sbdchd/squawk-action@v2
        if: steps.modified-migrations.outputs.file_names != ''
        with:
          files: ${{ steps.modified-migrations.outputs.file_names }}
          config: config/squawk.toml

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, openapi-drift, squawk]
    # lint is skipped on merge_group and on 'edited' events, hence the always() + skipped handling.
    # openapi-drift runs on both events and must have passed — don't build or
    # publish containers against a stale API contract.
    if: >-
      always() &&
      github.event.action != 'edited' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs['openapi-drift'].result == 'success' || needs['openapi-drift'].result == 'skipped') &&
      (needs.squawk.result == 'success' || needs.squawk.result == 'skipped')
    name: Build, Test, and Publish Containers
    permissions:
      contents: read
      actions: read
      checks: write

    env:
      NX_KEY: ${{ secrets.NX_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Derive appropriate SHAs for base and head for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Restore Nx Cache
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: .nx/cache
          key: nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-shared-${{ runner.os }}-

      - name: Run Tests
        run: bun nx affected --target=test --parallel=3 --outputStyle static

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: test-results
          path: |
            reports/**/*.xml
            apps/**/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: (!cancelled())
        with:
          name: Test Results
          use-actions-summary: true
          path: 'apps/**/build/test-results/**/TEST-*.xml,reports/apps/*/junit.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Run Build
        run: bun nx affected --target=build --parallel=3 --outputStyle static

      - name: Save Nx Cache
        uses: actions/cache/save@v5
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
