name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

jobs:
  # Runs on every PR event including title/body edits, which the other jobs
  # don't care about. The 'edited' type is on the shared trigger above so this
  # job fires then while the rest skip via github.event.action != 'edited'.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned to v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR title (can become squash merge commit message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint

      - name: Validate PR commits with commitlint
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Lint changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bunx lint-staged --diff="origin/$BASE_REF...HEAD" --config config/lint-staged.config.mjs

      - name: Fail if linters left uncommitted changes
        run: git diff --exit-code

  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    permissions:
      contents: read
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false
      - name: Detect changed file categories
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # pinned to v4.0.2
        with:
          filters: |
            helm:
              - 'k8s/helm/**'
            terraform:
              - 'infra/terraform/**'
              - '**/*.tf'
              - '**/*.tfvars'

  helm-lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'edited' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.helm == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Lint Helm chart
        run: helm lint k8s/helm/t99-app/ -f k8s/helm/t99-app/values.stage.yaml

  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() &&
      github.event.action != 'edited' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # pinned to v6.3.0
        with:
          tflint_version: v0.63.1
          tflint_config_path: infra/terraform/.tflint.hcl
      - name: Init tflint
        working-directory: infra/terraform
        run: tflint --init
      - name: Run tflint
        working-directory: infra/terraform
        run: |
          tflint --format checkstyle > ../../tflint.xml || true
          [ -s ../../tflint.xml ] || echo '<?xml version="1.0" encoding="UTF-8"?><checkstyle version="5.0"></checkstyle>' > ../../tflint.xml
      - name: Annotate tflint findings
        uses: ./.github/actions/reviewdog
        with:
          format: checkstyle
          input: tflint.xml
          name: tflint
          fail-level: error
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Regenerates every OpenAPI spec and the typed client from the code (no
  # containers: springdoc Gradle plugin, FastAPI in-memory export, Better Auth
  # in-process extraction) and fails when the committed files don't match —
  # an API change must ship its spec + generated-client update in the same PR.
  openapi-drift:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    name: OpenAPI Drift Check
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Generate OpenAPI specs and typed client
        run: bun run openapi

      - name: Fail if committed specs or generated client are out of date
        run: |
          if [ -n "$(git status --porcelain -- openapi/ apps/client/src/shared/api/generated/)" ]; then
            git status --short -- openapi/ apps/client/src/shared/api/generated/
            git diff -- openapi/ apps/client/src/shared/api/generated/
            echo "::error::OpenAPI specs are out of date. Run \`bun run openapi\` and commit the result."
            exit 1
          fi

  # GITHUB_BASE_REF and GITHUB_HEAD_REF are only set for pull_request events,
  # so this job must not run on merge_group.
  squawk:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find modified migrations
        id: modified-migrations
        run: |
          modified=$(git diff --diff-filter=d --name-only "origin/$GITHUB_BASE_REF...origin/$GITHUB_HEAD_REF" \
            | grep 'src/main/resources/db/migration/.*\.sql$' | tr '\n' ' ' || true)
          echo "$modified"
          echo "file_names=$modified" >> "$GITHUB_OUTPUT"

      - uses: sbdchd/squawk-action@8d113898e16c6cfd417ceba848b0edad97882be3 # pinned to v2
        if: steps.modified-migrations.outputs.file_names != ''
        with:
          files: ${{ steps.modified-migrations.outputs.file_names }}
          config: config/squawk.toml

  spelling:
    name: Spell Check
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # pinned to v1.48.0
        with:
          config: config/typos.toml

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false
      - name: Run actionlint
        # kics-scan ignore-line
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # pinned to 1.7.12
        with:
          args: -color

  build-and-test:
    runs-on: ubuntu-latest
    needs:
      [commitlint, lint, changes, helm-lint, tflint, openapi-drift, squawk, spelling, actionlint]
    # commitlint, lint, helm-lint, tflint, squawk, spelling, and actionlint are
    # skipped on merge_group and on 'edited' events, hence the always() + skipped
    # handling. openapi-drift runs on both events and must have passed — don't
    # build against a stale API contract.
    if: >-
      always() &&
      github.event.action != 'edited' &&
      (needs.commitlint.result == 'success' || needs.commitlint.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
      (needs['helm-lint'].result == 'success' || needs['helm-lint'].result == 'skipped') &&
      (needs.tflint.result == 'success' || needs.tflint.result == 'skipped') &&
      (needs['openapi-drift'].result == 'success' || needs['openapi-drift'].result == 'skipped') &&
      (needs.squawk.result == 'success' || needs.squawk.result == 'skipped') &&
      (needs.spelling.result == 'success' || needs.spelling.result == 'skipped') &&
      (needs.actionlint.result == 'success' || needs.actionlint.result == 'skipped')
    name: Build, Test, and Publish Containers
    permissions:
      contents: read
      actions: read
      checks: write

    env:
      NX_KEY: ${{ secrets.NX_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Derive appropriate SHAs for base and head for nx affected
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # pinned to v5

      - name: Restore Nx Cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # pinned to v5
        id: cache-restore
        with:
          path: .nx/cache
          key: nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-shared-${{ runner.os }}-

      - name: Run Tests
        run: bun nx affected --target=test --parallel=3 --outputStyle static

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned to v7
        if: (!cancelled())
        with:
          name: test-results
          path: |
            reports/**/*.xml
            apps/**/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # pinned to v3
        if: (!cancelled())
        with:
          name: Test Results
          use-actions-summary: true
          path: 'apps/**/build/test-results/**/TEST-*.xml,reports/apps/*/junit.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Run Build
        run: bun nx affected --target=build --parallel=3 --outputStyle static

      - name: Save Nx Cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # pinned to v5
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
