name: Deploy to Azure VM

# Reusable + manually-triggerable deploy. Runs the Ansible playbook against the
# VM to (re)deploy the stack at a given image tag.
#   - workflow_dispatch: the "Run workflow" button (pick any tag, default latest)
#   - workflow_call:      invoked by cd.yml on every release (passes the version)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. 0.1.2 or latest)'
        default: 'latest'
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the VM pull the private GHCR images using this job's GITHUB_TOKEN.
      packages: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write Ansible inventory
        working-directory: infra/ansible
        run: |
          cat > inventory.ini <<EOF
          [t99]
          ${{ secrets.VM_HOST }}

          [t99:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF

      # Configures the VM (idempotent) and redeploys the requested image tag.
      - name: Run Ansible playbook
        working-directory: infra/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook playbook.yml \
            --extra-vars "app_image_tag=${{ inputs.image_tag }}" \
            --extra-vars "domain=${{ vars.APP_DOMAIN }}" \
            --extra-vars "postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --extra-vars "better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}" \
            --extra-vars "google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --extra-vars "google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --extra-vars "llm_api_key=${{ secrets.LLM_API_KEY }}" \
            --extra-vars "ghcr_user=${{ github.actor }}" \
            --extra-vars "ghcr_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Deploy to Azure VM"
            echo ""
            echo "**Version:** \`${{ inputs.image_tag }}\`"
            echo "**Origin:** ${{ vars.APP_DOMAIN || 'http://<vm-ip>' }}"
          } >> "$GITHUB_STEP_SUMMARY"
