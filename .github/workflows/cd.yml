name: Continuous Delivery

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Docker Build & Publish Affected Containers
    outputs:
      images: ${{ steps.image_refs.outputs.images }}
      version: ${{ steps.image_refs.outputs.version }}

    permissions:
      # need write permissions for writing the tags
      contents: write
      # Required permissions for uploading to ghcr.io
      packages: write

    env:
      NX_KEY: ${{ secrets.NX_KEY }}

    steps:
      - name: Checkout Repository
        # zizmor: ignore[artipacked] — credentials are required; this job pushes git tags
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          fetch-depth: 0 # Required for Nx affected logic
          filter: tree:0 # Optional, but recommended by nx

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Derive appropriate SHAs for base and head for nx affected
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # pinned to v5

      - name: Restore Nx Cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # pinned to v5
        id: cache-restore
        with:
          path: .nx/cache
          # Key includes the OS and a hash of your lockfile.
          # We add the Run ID so it always creates a fresh entry for the next run.
          key:
            nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
            # Restore-keys allow it to find the MOST RECENT cache if an exact match isn't found.
          restore-keys: |
            nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-shared-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # pinned to v4

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # pinned to v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configure Git for pushing version tags
      - name: Configure git identity
        shell: bash
        run: >
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com' &&
          git config --global user.name 'github-actions[bot]'

      # Check whether conventional commits since the last tag warrant a release
      - name: Check if release is needed
        id: check-release
        run: |
          dry_run_output=$(bun nx release --dry-run 2>&1 || true)
          echo "$dry_run_output"
          if echo "$dry_run_output" | grep -q "No files would be changed"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Version, build, tag, and publish affected containers in one step
      - name: Tag Release & Publish Containers
        if: steps.check-release.outputs.needed == 'true'
        run: bun nx release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag each released image with :latest and push
      # nx release writes the versioned image ref to tmp/{projectRoot}/.docker-version
      - name: Push Latest Tags
        if: steps.check-release.outputs.needed == 'true'
        shell: bash
        run: |
          while IFS= read -r vfile; do
            image=$(cat "$vfile")
            base="${image%:*}"
            docker tag "$image" "$base:latest"
            docker push "$base:latest"
          done < <(find tmp -name ".docker-version" 2>/dev/null)

      # Collect registry digest for each pushed image so the attest job can fan out
      - name: Collect image refs and digests
        if: steps.check-release.outputs.needed == 'true'
        id: image_refs
        shell: bash
        run: |
          images='[]'
          tag=$(git describe --tags --abbrev=0)
          # Expose the released version (no leading v) for the deploy workflow.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          {
            echo "## Released Images"
            echo ""
            echo "**Release:** [\`$tag\`](https://github.com/${{ github.repository }}/releases/tag/$tag)"
            echo ""
            echo "| Image | Tags | Digest |"
            echo "|-------|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r vfile; do
            image=$(cat "$vfile")
            name="${image%:*}"
            tag="${image##*:}"
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest')
            images=$(echo "$images" | jq -c --arg n "$name" --arg d "$digest" '. + [{"name":$n,"digest":$d}]')
            echo "| \`$name\` | \`$tag\`, \`latest\` | \`${digest:7:12}…\` |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find tmp -name ".docker-version" 2>/dev/null)
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Write no-release summary
        if: steps.check-release.outputs.needed == 'false'
        run: |
          echo "## No Release" >> "$GITHUB_STEP_SUMMARY"
          echo "No conventional commits found that warrant a new release." >> "$GITHUB_STEP_SUMMARY"

      # This step runs even if the steps above fail
      - name: Save Nx Cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # pinned to v5
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  attest:
    name: Attest Image Provenance & SBOM
    needs: build-and-publish
    if: needs.build-and-publish.outputs.images != '' && needs.build-and-publish.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      attestations: write
      # Enables the linked artifacts page in the GitHub UI
      artifact-metadata: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.build-and-publish.outputs.images) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # pinned to v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance: proves this digest was built by this workflow from this commit.
      # Verifiable via: gh attestation verify oci://<image>@<digest> --repo <repo>
      - name: Attest build provenance
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # pinned to v4
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ matrix.image.name }}@${{ matrix.image.digest }}" \
            --repo "${{ github.repository }}"

      # SBOM: scans the built image by digest and produces a CycloneDX bill of
      # materials that reflects what actually ended up in the container, then
      # attaches it to the image in the registry via keyless cosign (OIDC —
      # no key management required).
      # Verifiable via: cosign verify-attestation --type cyclonedx <image>
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pinned to v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}@${{ matrix.image.digest }}
          format: cyclonedx
          output: sbom.cdx.json
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # pinned to v4.1.2

      - name: Attach SBOM to image
        run: |
          cosign attest \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            --yes \
            ${{ matrix.image.name }}@${{ matrix.image.digest }}

      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/" \
            ${{ matrix.image.name }}@${{ matrix.image.digest }}

      - name: Write attestation summary
        run: |
          {
            echo "## Attestation"
            echo ""
            echo "| Image | Digest | Provenance | SBOM |"
            echo "|-------|--------|------------|------|"
            echo "| \`${{ matrix.image.name }}\` | \`${{ matrix.image.digest }}\` | ✅ Verified | ✅ Attached |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage and Azure VM deployments are handled by their own workflows,
  # both triggered on release: released.
