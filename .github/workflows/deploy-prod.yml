name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v1.2.3) — find tags at Releases'
        required: true
        type: string

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Deploy to t99-prod
        run: |
          helm upgrade --install t99 k8s/helm/t99-app/ \
            -n t99-prod \
            -f k8s/helm/t99-app/values.yaml \
            -f k8s/helm/t99-app/values.prod.yaml \
            --set authService.image.tag="${{ inputs.version }}" \
            --set client.image.tag="${{ inputs.version }}" \
            --set transactionService.image.tag="${{ inputs.version }}" \
            --set notificationService.image.tag="${{ inputs.version }}" \
            --set budgetService.image.tag="${{ inputs.version }}" \
            --set genaiService.image.tag="${{ inputs.version }}" \
            --wait --timeout 5m

      - name: Write deploy summary
        run: |
          echo "## Deployed to Production" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://t99.stud.k8s.aet.cit.tum.de" >> "$GITHUB_STEP_SUMMARY"
