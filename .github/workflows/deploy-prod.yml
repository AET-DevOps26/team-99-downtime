name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. 0.1.2, without the v) — find tags at Releases'
        required: true
        type: string

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Deploy to t99-prod
        uses: ./.github/actions/deploy-k8s
        with:
          version: ${{ inputs.version }}
          namespace: t99-prod
          values-file: k8s/helm/t99-app/values.prod.yaml
          environment-url: https://t99.stud.k8s.aet.cit.tum.de
          kubeconfig-data: ${{ secrets.KUBECONFIG_DATA }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          studio-github-client-id: ${{ secrets.STUDIO_GITHUB_CLIENT_ID_PROD }}
          studio-github-client-secret: ${{ secrets.STUDIO_GITHUB_CLIENT_SECRET_PROD }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
