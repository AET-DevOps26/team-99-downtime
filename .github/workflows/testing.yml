name: Testing Pipeline

on:
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for Nx affected logic
          filter: tree:0 # Optional, but recommended by nx

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Lint changed files
        run: bunx lint-staged --diff="origin/${{ github.base_ref }}...HEAD" --config config/lint-staged.config.mjs

      - name: Fail if linters left uncommitted changes
        run: git diff --exit-code

  helm-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check for Helm chart changes
        id: helm-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            helm:
              - 'k8s/helm/**'

      - name: Lint Helm chart
        if: steps.helm-changes.outputs.helm == 'true'
        run: helm lint k8s/helm/t99-app/ -f k8s/helm/t99-app/values.stage.yaml

  # Regenerates every OpenAPI spec and the typed client from the code (no
  # containers: springdoc Gradle plugin, FastAPI in-memory export, Better Auth
  # in-process extraction) and fails when the committed files don't match —
  # an API change must ship its spec + generated-client update in the same PR.
  openapi-drift:
    runs-on: ubuntu-latest
    name: OpenAPI Drift Check
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # This job only reads the repo and diffs generated output; don't
          # leave the GITHUB_TOKEN on disk for the forked service processes.
          persist-credentials: false

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      # Same single command devs run locally — pipeline needs no change when
      # the script's internals do.
      - name: Generate OpenAPI specs and typed client
        run: bun run openapi

      - name: Fail if committed specs or generated client are out of date
        run: |
          if [ -n "$(git status --porcelain -- openapi/ apps/client/src/shared/api/generated/)" ]; then
            git status --short -- openapi/ apps/client/src/shared/api/generated/
            git diff -- openapi/ apps/client/src/shared/api/generated/
            echo '::error::OpenAPI specs are out of date. Run `bun run openapi` and commit the result.'
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    # lint is skipped on merge_group, hence the always() + skipped handling;
    # openapi-drift runs on both events and must have passed — don't build or
    # publish containers against a stale API contract.
    needs: [lint, openapi-drift]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && needs['openapi-drift'].result == 'success'
    name: Build, Test, and Publish Containers

    permissions:
      contents: read
      actions: read # Required for nrwl/nx-set-shas
      checks: write # Required for dorny/test-reporter

    env:
      NX_KEY: ${{ secrets.NX_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for Nx affected logic
          filter: tree:0 # Optional, but recommended by nx

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Derive appropriate SHAs for base and head for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Restore Nx Cache
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: .nx/cache
          # Key includes the OS and a hash of your lockfile.
          # We add the Run ID so it always creates a fresh entry for the next run.
          key: nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          # Restore-keys allow it to find the MOST RECENT cache if an exact match isn't found.
          restore-keys: |
            nx-shared-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nx-shared-${{ runner.os }}-

      # Run affected tests across React, Python, and Spring Boot
      - name: Run Tests
        run: bun nx affected --target=test --parallel=3 --outputStyle static

      # Upload raw XML for debugging even if publishing fails
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: test-results
          path: |
            reports/**/*.xml
            apps/**/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

      # Creates a GitHub Check Run with per-suite pass/fail counts
      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: (!cancelled())
        with:
          name: Test Results
          use-actions-summary: true
          # junit.xml = vitest + pytest; TEST-*.xml = Gradle (always this naming)
          path: 'apps/**/build/test-results/**/TEST-*.xml,reports/apps/*/junit.xml'
          reporter: java-junit
          # Don't fail here — the Run Tests step already gates the job
          fail-on-error: false
          fail-on-empty: false

      # Run affected builds
      - name: Run Build
        run: bun nx affected --target=build --parallel=3 --outputStyle static

      # This step runs even if the steps above fail
      - name: Save Nx Cache
        uses: actions/cache/save@v5
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
