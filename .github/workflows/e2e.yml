name: E2E Tests

# Playwright suite against the deployed stage environment. Runs after every
# Continuous Deployment run that actually deployed to stage, plus on demand.
# Deliberately a separate workflow: a failing e2e run is a visible red run on
# main but never blocks PRs or the CD pipeline. When the suite fails, stage is
# rolled back to the previous Helm revision (manual runs can opt out via the
# rollback_on_failure input, e.g. to inspect a broken deploy in place).
on:
  workflow_run:
    workflows: ['Continuous Deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run the suite against'
        default: 'https://stage.t99.stud.k8s.aet.cit.tum.de'
        type: string
      rollback_on_failure:
        description: 'Roll back the stage release if the suite fails'
        default: true
        type: boolean

# Two releases in quick succession: only the run against the newest deploy matters.
concurrency:
  group: e2e-stage
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # dorny/test-reporter
  actions: read # read the triggering CD run's jobs

jobs:
  # Runs on BOTH trigger types so it is never skipped — a skipped needed job
  # would silently skip the e2e job too. CD completes "successfully" even when
  # no release was cut, so gate on the Deploy to Stage job having succeeded.
  check-deploy:
    name: Check Stage Deploy
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate on the triggering deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Job *names*, not YAML job ids, are what the API exposes.
          conclusion=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq '.jobs[] | select(.name == "Deploy to Stage") | .conclusion')
          echo "Deploy to Stage conclusion: ${conclusion:-<job did not run>}"
          if [ "$conclusion" = "success" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright E2E
    needs: check-deploy
    if: needs.check-deploy.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty for workflow_run events, so the || default applies there.
      E2E_BASE_URL: ${{ inputs.base_url || 'https://stage.t99.stud.k8s.aet.cit.tum.de' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          # Test-only job — never writes the GITHUB_TOKEN into .git/config.
          persist-credentials: false

      # Only bun is needed — no Java/Python, so skip the setup-build-tools action.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned to v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: bun nx e2e client-e2e

      # Paths are relative to the Playwright config dir (apps/client-e2e).
      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned to v7
        if: (!cancelled())
        with:
          name: playwright-report
          path: |
            apps/client-e2e/playwright-report
            apps/client-e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # pinned to v3
        if: (!cancelled())
        with:
          name: E2E Test Results
          use-actions-summary: true
          path: reports/apps/client-e2e/junit.xml
          reporter: java-junit
          # The Run E2E Tests step already gates the job
          fail-on-error: false
          fail-on-empty: false

  # A failing suite against a fresh deploy means stage is functionally broken
  # even though the Helm release itself went healthy (cd.yml's
  # --rollback-on-failure only covers deploys that never became healthy).
  # Roll back to the previous revision — the last release the suite passed on.
  # Manual runs only roll back when they actually tested stage AND the
  # rollback_on_failure box stayed checked; automatic runs always roll back.
  rollback:
    name: Rollback Stage Deploy
    needs: e2e
    if: >-
      failure() && needs.e2e.result == 'failure' &&
      (github.event_name != 'workflow_dispatch' ||
        (inputs.rollback_on_failure &&
         inputs.base_url == 'https://stage.t99.stud.k8s.aet.cit.tum.de'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Talks only to the cluster — no GitHub token needed.
    permissions: {}
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # pinned to v5
        with:
          version: 'v4.2.0'

      # No revision argument: helm targets the previous revision. Fails loudly
      # (instead of guessing) when there is no earlier revision to return to.
      - name: Rollback t99-stage
        run: |
          echo "Release history before rollback:"
          helm history t99 -n t99-stage --max 5
          helm rollback t99 -n t99-stage --wait --timeout 10m

      - name: Write rollback summary
        run: |
          {
            echo "## Stage Rolled Back"
            echo ""
            echo "E2E tests failed — \`t99-stage\` was rolled back to the previous release."
            echo ""
            echo '```'
            helm history t99 -n t99-stage --max 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
