name: Deploy to Azure VM

# Triggered automatically on every release if the DEPLOY_AZURE_ENABLED repo
# variable is set to 'true' (Settings → Secrets and variables → Actions → Variables).
# The workflow_dispatch trigger always runs regardless of that variable.
#
# workflow_dispatch inputs:
#   shutdown: destroy the VM without deploying (fully resets infrastructure)
#   image_tag: tag to deploy when not using the shutdown option
#
# Required secrets: ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_SUBSCRIPTION_ID, ARM_TENANT_ID
#   VM_SSH_PRIVATE_KEY, POSTGRES_PASSWORD, BETTER_AUTH_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, LLM_API_KEY
# Required variables: TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_RESOURCE_GROUP,
#   VM_SSH_PUBLIC_KEY, APP_DOMAIN
# Optional variables: DEPLOY_AZURE_ENABLED, AZURE_VM_AUTO_SHUTDOWN
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      shutdown:
        description: 'Destroy the VM without deploying anything'
        type: boolean
        default: false
      image_tag:
        description: 'Image tag to deploy (e.g. 0.1.2 or latest) — ignored when shutdown is true'
        default: 'latest'
        type: string

# Minimal permissions; each job declares only what it needs.
permissions: {}

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # On release: gated by the DEPLOY_AZURE_ENABLED repo variable.
    # On workflow_dispatch: runs unless the shutdown flag is set.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.shutdown != true) ||
      (github.event_name == 'release' && vars.DEPLOY_AZURE_ENABLED == 'true')
    permissions:
      contents: read
      # Lets the VM pull the private GHCR images using this job's GITHUB_TOKEN.
      packages: read
      deployments: write
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.release.tag_name }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      VM_SSH_PUBLIC_KEY: ${{ vars.VM_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # pinned to v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP"

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var "ssh_public_key=$VM_SSH_PUBLIC_KEY"

      - name: Get VM host
        id: vm-host
        working-directory: infra/terraform
        run: echo "host=$(terraform output -raw app_host)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pinned to v6
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Write Ansible inventory
        working-directory: infra/ansible
        env:
          VM_HOST: ${{ steps.vm-host.outputs.host }}
        run: |
          cat > inventory.ini <<EOF
          [t99]
          $VM_HOST

          [t99:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF

      # Configures the VM (idempotent) and redeploys the requested image tag.
      - name: Run Ansible playbook
        working-directory: infra/ansible
        env:
          DEPLOY_DOMAIN: ${{ vars.APP_DOMAIN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          IMAGE_TAG="${IMAGE_TAG#v}"
          ansible-playbook playbook.yml \
            --extra-vars "app_image_tag=$IMAGE_TAG" \
            --extra-vars "domain=$DEPLOY_DOMAIN" \
            --extra-vars "postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --extra-vars "better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}" \
            --extra-vars "google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --extra-vars "google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --extra-vars "llm_api_key=${{ secrets.LLM_API_KEY }}" \
            --extra-vars "ghcr_user=$GHCR_USER" \
            --extra-vars "ghcr_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Write deploy summary
        if: always()
        env:
          DEPLOY_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          IMAGE_TAG="${IMAGE_TAG#v}"
          {
            echo "## Deploy to Azure VM"
            echo ""
            echo "**Version:** \`$IMAGE_TAG\`"
            echo "**Origin:** ${DEPLOY_DOMAIN:-http://<vm-ip>}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Destroys the VM 30 minutes after a successful deploy.
  # Gated by the AZURE_VM_AUTO_SHUTDOWN repo variable (set to 'true' to enable).
  auto-shutdown:
    name: Auto-shutdown after 30 minutes
    needs: [deploy]
    if: needs.deploy.result == 'success' && vars.AZURE_VM_AUTO_SHUTDOWN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      VM_SSH_PUBLIC_KEY: ${{ vars.VM_SSH_PUBLIC_KEY }}
    steps:
      - name: Wait 30 minutes
        run: sleep 1800

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # pinned to v3.1.2

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP"

      - name: Terraform destroy
        working-directory: infra/terraform
        run: |
          terraform destroy -auto-approve \
            -var "ssh_public_key=$VM_SSH_PUBLIC_KEY"

  # Runs when workflow_dispatch is triggered with shutdown: true.
  # Immediately destroys the VM without deploying anything.
  destroy-vm:
    name: Destroy VM
    if: github.event_name == 'workflow_dispatch' && inputs.shutdown == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      VM_SSH_PUBLIC_KEY: ${{ vars.VM_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned to v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # pinned to v3.1.2

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP"

      - name: Terraform destroy
        working-directory: infra/terraform
        run: |
          terraform destroy -auto-approve \
            -var "ssh_public_key=$VM_SSH_PUBLIC_KEY"
