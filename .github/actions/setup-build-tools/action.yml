name: 'Setup Build Tools'
description: 'Setup bun, python, python uv, Java, and Gradle for reusable workflow steps'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # pinned to v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # pinned to v6.2.0
      with:
        add-job-summary: never

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned to v2
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Install uv (Python Package & Version Manager)
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
