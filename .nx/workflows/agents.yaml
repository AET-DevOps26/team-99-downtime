launch-templates:
  polyglot-linux:
    resource-class: "docker_linux_amd64/medium"
    image: "ubuntu22.04-node20.19-v3"
    init-steps:
      - name: Checkout
        uses: "nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml"

      - name: Install Runtime Tools
        script: |
          # 1. Install Bun
          curl -fsSL https://bun.sh/install | bash

          # 2. Install UV (Modern Python)
          curl -LsSf https://astral.sh/uv/install.sh | sh

          # 3. Ensure Java (Already in v7+ images, but let's be safe)
          sudo apt-get update && sudo apt-get install -y openjdk-21-jdk

          # Persist these paths for all subsequent tasks on this agent
          echo "PATH=$HOME/.bun/bin:$HOME/.cargo/bin:$PATH" >> $NX_CLOUD_ENV
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $NX_CLOUD_ENV

      - name: Install Dependencies
        script: |
          bun install
          # uv sync # if using uv at root
