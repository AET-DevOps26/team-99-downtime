name: team-99-downtime

x-java-service: &java-service
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
  networks: [team99]

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [team99]

  transaction-service:
    <<: *java-service
    image: ${IMAGE_REGISTRY:-team99}/transaction-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/transaction-service/Dockerfile
    ports:
      - "8080:8080"

  notification-service:
    <<: *java-service
    image: ${IMAGE_REGISTRY:-team99}/notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    ports:
      - "8081:8081"

  budget-service:
    <<: *java-service
    image: ${IMAGE_REGISTRY:-team99}/budget-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/budget-service/Dockerfile
    ports:
      - "8082:8082"

  genai-service:
    image: ${IMAGE_REGISTRY:-team99}/genai-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/genai-service/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    networks: [team99]

  client:
    image: ${IMAGE_REGISTRY:-team99}/client:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: always
    ports:
      - "80:80"
    networks: [team99]

volumes:
  postgres_data:

networks:
  team99:
