# Single-node Loki: no clustering, no object store. Dev/demo topology.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  # One replica, so the ring has no peers to gossip with.
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# tsdb + v13 is the current pairing for Loki 3.x; older schemas are read-only.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
