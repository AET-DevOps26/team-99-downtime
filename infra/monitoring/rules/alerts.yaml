groups:
  - name: t99-availability
    rules:
      - alert: ServiceDown
        expr: up{job="expenseflow-services"} == 0
        for: 2m
        labels:
          severity: critical
          # `up` is labelled `service` (budget), every other rule keys off
          # Micrometer's `application` (budget-service). Without this, grouping
          # and inhibition never match.
          application: '{{ $labels.service }}-service'
        annotations:
          summary: 'Service {{ $labels.service }} is down'
          description: 'Prometheus has been unable to scrape {{ $labels.service }} for more than 2 minutes.'

  - name: t99-traffic
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High 5xx error rate on {{ $labels.application }}'
          description: '{{ $labels.application }} is returning more than 5% server errors over the last 5 minutes.'

      # Same signal as the warning above, one tier up: this is an outage, not a blip.
      - alert: CriticalHttpErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m]))
            > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Critical 5xx error rate on {{ $labels.application }}'
          description: '{{ $labels.application }} is returning more than 20% server errors over the last 5 minutes.'

      # genai answers 502 LLM_UNAVAILABLE when the Logos gateway is unreachable.
      # Warning, not critical: the AI features are dead but the rest of the app
      # works, and the cause is outside our cluster.
      - alert: LlmGatewayUnavailable
        expr: |
          sum(rate(http_server_requests_seconds_count{application="genai-service", status="502"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          application: genai-service
        annotations:
          summary: 'LLM gateway unreachable'
          description: 'genai-service has been answering 502 LLM_UNAVAILABLE for 2 minutes; categorization and summaries are down.'

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Slow responses on {{ $labels.application }}'
          description: 'p95 latency for {{ $labels.application }} has exceeded 1s for 10 minutes.'

  - name: t99-runtime
    rules:
      # Restart count without kube-state-metrics: a restart resets the process
      # start time, so changes() over it counts restarts.
      - alert: PodRestartsHigh
        expr: changes(process_start_time_seconds[1h]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Crash loop on {{ $labels.application }}'
          description: '{{ $labels.application }} has restarted more than 5 times in the last hour.'

      # Fraction of all cores, 0-1. Every service exports it: Micrometer on the
      # JVM side, hand-rolled in auth/genai to the same definition.
      - alert: HighCpuUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU on {{ $labels.application }}'
          description: '{{ $labels.application }} has been above 80% CPU for 5 minutes.'

      - alert: JvmHeapPressure
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            /
          sum by (application) (jvm_memory_max_bytes{area="heap"})
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'JVM heap pressure on {{ $labels.application }}'
          description: '{{ $labels.application }} has used more than 90% of its max heap for 10 minutes.'
