# Tails every container in this compose project and pushes to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # Socket discovery rather than reading /var/lib/docker/containers: works the
    # same on Windows/macOS, and hands us the compose service name as a label.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.project=team-99-downtime']
    relabel_configs:
      # Keep labels low-cardinality — every distinct value is a new Loki stream.
      # Service name, container, stdout/stderr. Never ids or timestamps.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'job'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
