spring:
  datasource:
    url: jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:3000/api/auth/jwks
auth:
  issuer: http://localhost:9099
services:
  transaction:
    url: http://transaction-service:8080
  notification:
    url: http://notification-service:8081
