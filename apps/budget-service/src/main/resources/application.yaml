spring:
  application:
    name: budget-service
  # The datasource is not declared here on purpose: in docker it is injected via
  # SPRING_DATASOURCE_URL/USERNAME/PASSWORD (see docker-compose.yaml), and tests
  # fall back to an embedded H2. Only JPA behaviour is configured below.
  jpa:
    hibernate:
      # Dev-grade schema management: Hibernate creates/updates tables from the
      # entities on startup. Fine for the course project; switch to a Flyway
      # migration before this is treated as production data.
      ddl-auto: update
    # Avoid holding a DB session open through view rendering — keeps the request
    # boundary clean and silences the open-in-view startup warning.
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fetch the public keys server-to-server. We use jwk-set-uri (NOT
          # issuer-uri) on purpose: issuer-uri would trigger OIDC discovery
          # against the issuer origin (:4200), which is the browser-facing URL
          # and is not reachable from inside the network.
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:3000/api/auth/jwks}

server:
  port: 8082

service:
  me-path: /api/budgets/me

# The issuer claim ("iss") tokens must carry: BETTER_AUTH_URL = the Caddy
# gateway, validated explicitly in SecurityConfig.
auth:
  issuer: ${AUTH_ISSUER:http://localhost:9099}

services:
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://transaction-service:8080}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8081}

springdoc:
  api-docs:
    path: /api/budgets/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${APP_VERSION:dev}
