spring:
  application:
    name: transaction-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fetch the public keys server-to-server. We use jwk-set-uri (NOT
          # issuer-uri) on purpose: issuer-uri would trigger OIDC discovery
          # against the issuer origin (auth.issuer, :4200), which is the
          # browser-facing URL and is not reachable from inside the network.
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:3000/api/auth/jwks}

# The issuer claim ("iss") that tokens must carry. This is the browser-facing
# auth origin (BETTER_AUTH_URL), validated explicitly in JwtSecurityConfig.
auth:
  issuer: ${AUTH_ISSUER:http://localhost:4200}
