spring:
  application:
    name: transaction-service
  # Bounded timeouts for clients built from the auto-configured RestClient.Builder
  # (SummaryClient). The read timeout stays above genai's own 30s LLM budget, so a
  # hung genai call can't stall the single-threaded scheduler indefinitely.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:3000/api/auth/jwks}

server:
  port: 8080

service:
  me-path: /api/transactions/me

auth:
  issuer: ${AUTH_ISSUER:http://localhost:9099}

services:
  budget:
    url: ${BUDGET_SERVICE_URL:http://budget-service:8082}
  genai:
    url: ${GENAI_SERVICE_URL:http://genai-service:8000}

# Weekly AI summary generation (US-11): Sunday evening, when the week being
# summarized is effectively complete. Override SUMMARY_CRON to demo the job
# without waiting a week (e.g. "0 */2 * * * *" = every 2 minutes).
summary:
  cron: ${SUMMARY_CRON:0 0 20 * * SUN}
  zone: ${SUMMARY_ZONE:Europe/Berlin}

springdoc:
  api-docs:
    path: /api/transactions/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${APP_VERSION:dev}
