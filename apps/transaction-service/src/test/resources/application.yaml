spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:3000/api/auth/jwks
auth:
  issuer: http://localhost:9099
services:
  budget:
    url: http://budget-service:8082
  genai:
    url: http://genai-service:8000
summary:
  # Same shape as production; tests invoke the job directly, never via the clock.
  cron: 0 0 20 * * SUN
  zone: Europe/Berlin
