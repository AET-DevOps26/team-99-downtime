[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov-report xml:'../../reports/apps/genai-service/coverage.xml'
 --junitxml='../../reports/apps/genai-service/junit.xml'
"""

[project]
name = "genai-service"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.9,<4"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.128.8",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "pyjwt[crypto]>=2.10.0",
    "uvicorn>=0.39.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

# FastAPI's dependency-injection idiom passes Depends()/Security() as argument
# defaults; that's intentional, so exempt them from B008 ("function call in
# default argument").
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Security",
]
