spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:3000/api/auth/jwks}

server:
  port: 8081

service:
  me-path: /api/notifications/me

auth:
  issuer: ${AUTH_ISSUER:http://localhost:9099}
